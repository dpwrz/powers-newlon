name: Diagnose Mason live data

on:
  push:
    paths:
      - '.github/mason-live-trigger'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Sleeper and ESPN live data
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r), {k.lower():v for k,v in r.headers.items()}

          players,_=get('https://api.sleeper.app/v1/players/nfl?position=RB&active=true')
          mason=None
          for pid,p in players.items():
              if (p.get('full_name') or f"{p.get('first_name','')} {p.get('last_name','')}".strip()).lower()=='jordan mason':
                  mason=(pid,p); break
          if not mason:
              raise SystemExit('Jordan Mason not found in Sleeper RB feed')
          pid,p=mason
          print('SLEEPER_ID',pid)
          for k in ['full_name','status','injury_status','injury_body_part','injury_notes','injury_start_date','espn_id','team']:
              print('SLEEPER',k,repr(p.get(k)))

          search,h=get('https://site.web.api.espn.com/apis/search/v2?limit=20&query='+urllib.parse.quote(p['full_name']))
          print('SEARCH_ACAO',h.get('access-control-allow-origin'))
          print('SEARCH_KEYS',sorted(search.keys()))
          print('SEARCH_RAW',json.dumps(search)[:6000])

          espn=p.get('espn_id')
          if not espn:
              text=json.dumps(search)
              import re
              m=re.search(r'"id"\s*:\s*"?(\d{5,})"?',text)
              if m: espn=m.group(1)
          print('RESOLVED_ESPN_ID',espn)

          if espn:
              data,h=get(f'https://site.api.espn.com/apis/fantasy/v2/games/ffl/news/players?limit=20&playerId={espn}')
              feed=data.get('feed') or []
              print('ESPN_FEED_COUNT',len(feed))
              print('ESPN_NEWS_ACAO',h.get('access-control-allow-origin'))
              for a in feed[:5]:
                  print('NEWS',repr(a.get('published')),repr(a.get('headline')))

          league,h=get('https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=100')
          articles=league.get('articles') or []
          matches=[]
          needle='jordan mason'
          for a in articles:
              txt=((a.get('headline') or '')+' '+(a.get('description') or '')).lower()
              if needle in txt: matches.append(a)
          print('LEAGUE_NEWS_ACAO',h.get('access-control-allow-origin'))
          print('LEAGUE_MATCH_COUNT',len(matches))
          for a in matches[:5]: print('LEAGUE_NEWS',repr(a.get('published')),repr(a.get('headline')))
          PY
