name: Historical predictive research
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/research_signals.py', '.github/workflows/research-signals.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scikit-learn==1.6.1
      - run: python scripts/research_signals.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-research
          path: output/research_signals_2026.json
