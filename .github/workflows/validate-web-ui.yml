name: Validate web UI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "web/**"
      - ".github/workflows/validate-web-ui.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/boot.js
      - name: Validate and build
        run: npm run build
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke test iPhone and desktop UX
        timeout-minutes: 4
        run: node scripts/smoke-ui.mjs
      - name: Attach browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-2-1-screenchecks
          path: web/ui-qa/*.png
          if-no-files-found: ignore
      - name: Smoke test Fieldnote prototype across screen sizes
        timeout-minutes: 4
        run: node scripts/smoke-fieldnote.mjs
      - name: Upload Fieldnote design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldnote-concept-screens
          path: web/ui-qa-fieldnote/*.png
          if-no-files-found: ignore
