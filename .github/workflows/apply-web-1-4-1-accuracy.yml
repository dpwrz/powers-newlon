name: Apply Web 1.4.1 Live Accuracy

on:
  push:
    paths:
      - '.github/web-1-4-1-accuracy-trigger'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch_web_1_4_1_accuracy.py
      - name: JavaScript syntax check
        run: node --check web/src/main.js
      - name: Build exactly as Cloudflare Pages
        run: npm run build
      - name: Verify Pages output
        run: |
          test -f dist/index.html
          test -d dist/assets
      - name: Verify live accuracy wiring
        run: |
          grep -q "live_accuracy_cumulative_summary_" pipeline/24_score_live_accuracy_2_5.R
          grep -q "live_overall" scripts/export_model_snapshot.R
          grep -q "Season by position" web/src/main.js
      - name: Commit production feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/main.js web/package.json scripts/export_model_snapshot.R pipeline/24_score_live_accuracy_2_5.R
          git commit -m "Show live season accuracy in control room"
          git push
