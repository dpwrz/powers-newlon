name: Benchmark finality regression tests
on:
  pull_request:
    paths:
      - 'R/live_refresh_engine_25.R'
      - 'scripts/check_benchmark_finality.py'
      - 'tests/test_benchmark_finality.py'
      - '.github/workflows/benchmark-finality-tests.yml'
  push:
    branches: [main]
    paths:
      - 'R/live_refresh_engine_25.R'
      - 'scripts/check_benchmark_finality.py'
      - 'tests/test_benchmark_finality.py'
      - '.github/workflows/benchmark-finality-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run finality unit tests
        run: python -m unittest discover -s tests -p 'test_benchmark_finality.py' -v
