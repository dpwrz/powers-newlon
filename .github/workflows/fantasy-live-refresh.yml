name: Fantasy Model 3.1 live refresh

on:
  workflow_dispatch:
    inputs:
      skip_model_refresh:
        description: "Skip model refresh and reuse existing snapshot"
        required: false
        default: false
        type: boolean
      force:
        description: "Force refresh even if the projection-relevant state is unchanged"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 11 * * *'
    - cron: '30 5 * * 5'
    - cron: '45 21 * * 0'
    - cron: '45 1 * * 1'
    - cron: '45 5 * * 1'
    - cron: '45 5 * * 2'
    - cron: '45 5 * * 0'

permissions:
  contents: write

concurrency:
  group: fantasy-model-31-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Fantasy Model
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        if: ${{ !inputs.skip_model_refresh }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        if: ${{ !inputs.skip_model_refresh }}
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::readr
            any::tidyr
            any::tibble
            any::purrr
            any::janitor
            any::jsonlite
            any::nflreadr
            any::rpart
            any::xgboost
            any::ranger
            any::slider
            any::httr2
          cache-version: 6

      - name: Check production runtime
        if: ${{ !inputs.skip_model_refresh }}
        run: |
          Rscript tests/TEST_3_0_PRODUCTION.R
          Rscript tests/TEST_3_1_RUNTIME.R

      - name: Refresh unplayed player-weeks, ROS, performance and snapshot
        if: ${{ !inputs.skip_model_refresh }}
        env:
          FM_RELEASE_VERSION: '3.1'
          FM_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: Rscript RUN_AUTO_REFRESH.R

      - name: Verify refreshed snapshot
        if: ${{ !inputs.skip_model_refresh }}
        run: test -f output/model_snapshot.json

      - name: Sync snapshot into web app and publish version manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public/data

          if [ -f output/model_snapshot.json ]; then
            cp output/model_snapshot.json web/public/data/model_snapshot.json
            echo "Synced refreshed snapshot into web app."
          elif [ -f web/public/data/model_snapshot.json ]; then
            echo "No new engine snapshot found; retaining existing web snapshot."
          else
            echo "No model snapshot is available."
            exit 1
          fi

          SNAPSHOT="web/public/data/model_snapshot.json"
          VERSION="$(sha256sum "$SNAPSHOT" | awk '{print $1}')"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"version":"%s","snapshot":"model_snapshot.json","published_at":"%s","contract":"web-1.1-versioned-snapshot"}\n' \
            "$VERSION" "$PUBLISHED_AT" > web/public/data/snapshot_version.json
          echo "Published lightweight snapshot manifest: $VERSION"

      - name: Commit persistent engine and web state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f output/model_snapshot.json ]; then
            git add -f data/state/ output/model_snapshot.json output/ web/public/data/model_snapshot.json web/public/data/snapshot_version.json 2>/dev/null || true
          elif [ -f web/public/data/model_snapshot.json ]; then
            git add -f data/state/ web/public/data/model_snapshot.json web/public/data/snapshot_version.json 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo "No persistent state changes to commit."
            exit 0
          fi

          git commit -m "Auto-refresh Fantasy Model 3.1 production state"

          if [[ -n "$(git status --porcelain)" ]]; then
            git stash push --include-untracked -m "ci-runtime-leftovers"
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
