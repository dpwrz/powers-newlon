name: Fantasy Model 3.1 weekly learning

on:
  workflow_dispatch:
  push:
    branches:
      - weekly-learning-31
    paths:
      - 'R/weekly_learning_31.R'
      - 'R/weekly_engine_31.R'
      - 'runners/RUN_3_1_WEEKLY.R'
      - 'runners/RUN_3_1_WEEKLY_LEARNING.R'
      - 'maintenance/BACKFILL_WEEKLY_LEARNING_FEATURES_FROM_GIT.R'
      - 'tests/TEST_3_1_WEEKLY_LEARNING.R'
      - '.github/workflows/fantasy-weekly-learning.yml'
  schedule:
    # Tuesday morning after Monday Night Football, with time for final stats.
    - cron: '45 12 * * 2'

permissions:
  contents: write

concurrency:
  group: fantasy-model-production-state
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout Fantasy Model
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install weekly-learning dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::readr
            any::tidyr
            any::tibble
            any::purrr
            any::janitor
            any::jsonlite
            any::nflreadr
            any::rpart
            any::xgboost
            any::ranger
            any::slider
            any::httr2
          cache-version: 7

      - name: Check weekly-learning integrity
        run: |
          Rscript tests/TEST_3_1_RUNTIME.R
          Rscript tests/TEST_3_1_BENCHMARK_ARCHIVE.R
          Rscript tests/TEST_3_1_WEEKLY_LEARNING.R

      - name: Finalize actuals, learn and refresh projections
        env:
          FM_RELEASE_VERSION: '3.1'
          FM_CURRENT_SEASON_WEIGHT: '1.5'
        run: Rscript runners/RUN_3_1_WEEKLY.R

      - name: Capture next pregame benchmark and learning features
        env:
          FM_RELEASE_VERSION: '3.1'
        run: Rscript runners/RUN_3_1_BENCHMARK_ARCHIVE.R

      - name: Verify immutable history and outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f data/processed/weekly_model_table_2_3.csv
          test -f output/model_snapshot.json
          test -f web/public/data/model_snapshot.json
          if [ -f data/processed/weekly_learning_current_2026.csv ]; then
            test -f data/processed/weekly_learning_ledger_2026.csv
          fi

      - name: Sync web snapshot and publish version manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public/data
          cp output/model_snapshot.json web/public/data/model_snapshot.json
          SNAPSHOT="web/public/data/model_snapshot.json"
          VERSION="$(sha256sum "$SNAPSHOT" | awk '{print $1}')"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"version":"%s","snapshot":"model_snapshot.json","published_at":"%s","contract":"web-1.1-versioned-snapshot"}\n' \
            "$VERSION" "$PUBLISHED_AT" > web/public/data/snapshot_version.json

      - name: Commit weekly learning and production state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            data/state/ \
            data/processed/weekly_learning_*.csv \
            output/weekly_learning_capture_status_*.csv \
            output/weekly_learning_backfill_status_*.csv \
            output/weekly_3_1_online_*.csv \
            output/live_accuracy_*.csv \
            output/pregame_projection_archive_*.csv \
            output/benchmark_*.csv \
            output/model_snapshot.json \
            models/weekly_3_1_incremental/ \
            models/weekly_3_1_production_history/ \
            models/weekly_3_1_direct_*.json \
            models/weekly_3_1_direct_*_meta.rds \
            web/public/data/model_snapshot.json \
            web/public/data/snapshot_version.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No weekly learning state changes to commit."
            exit 0
          fi

          git commit -m "Weekly-learn Fantasy Model 3.1 production state"

          if [[ -n "$(git status --porcelain)" ]]; then
            git stash push --include-untracked -m "weekly-learning-runtime-leftovers"
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
