name: Verified weekly benchmark
on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 2,3,4'
  pull_request:
    paths: ['scripts/benchmark_verified.py', 'scripts/research_calibration.py', '.github/workflows/verified-benchmark.yml']
  push:
    branches: [main]
    paths: ['scripts/benchmark_verified.py', 'scripts/research_calibration.py', '.github/workflows/verified-benchmark.yml']
permissions:
  contents: write
concurrency:
  group: verified-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/benchmark_verified.py
      - run: python scripts/research_calibration.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-benchmark
          path: |
            output/benchmark_verified_2026.json
            output/benchmark_matched_2026.csv
            output/research_calibration_2026.json
      - name: Publish verified report
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/benchmark_verified_2026.json output/benchmark_matched_2026.csv output/research_calibration_2026.json
          git diff --cached --quiet || git commit -m 'Publish verified weekly benchmark'
          git pull --rebase
          git push
