name: Apply Web 1.3.2 availability and news

on:
  push:
    branches: [main]
    paths:
      - '.github/web-1-3-2-trigger'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python scripts/patch_web_1_3_2.py
      - name: Syntax check
        run: node --check web/src/main.js
      - name: Build exactly as Cloudflare Pages
        run: npm run build
      - name: Verify Pages output
        run: |
          test -f dist/index.html
          test -f dist/data/model_snapshot.json
          test -f dist/data/snapshot_version.json
          test -f dist/_headers
      - name: Commit Web 1.3.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/main.js web/src/styles.css web/package.json
          git commit -m "Add live injury overrides and player news"
          git pull --rebase origin main
          git push origin HEAD:main
