function sparkTrend(values){let points=values.map((n,i)=>`${i*20+4},${39-(n-7)*1.15}`).join(' ');return `<svg class="spark" viewBox="0 0 130 49" aria-hidden="true"><line x1="1" y1="42" x2="128" y2="42" stroke="currentColor" opacity=".1"/><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function nav(){let labels={home:'Briefing',decisions:'Decisions',scout:'Scout',connect:'Connect'};return Object.entries(labels).map(([key,label])=>`<button class="nav-link ${state.screen===key?'active':''}" data-nav="${key}" ${state.screen===key?'aria-current="page"':''}>${icon(key)}<span>${label}</span></button>`).join('')}
function shell(content){let label={home:'Briefing',decisions:'Decision Lab',scout:'Scout',connect:'Connect'}[state.screen];return `<div class="frame"><aside class="side"><div class="identity"><div class="identity-top"><div class="brand-mark">PN</div><div class="wordmark">Powers–Newlon<small>THE MODEL · FANTASY MANAGER</small></div></div></div><nav class="side-nav" aria-label="App sections">${nav()}</nav><div class="side-bottom"><strong>MODEL / 2026</strong>Illustrative PPR projections<br><em>Read-only concept</em></div></aside><main class="main"><div class="topline"><div class="breadcrumb">WORKSPACE / <b>${label}</b></div><div class="top-utility"><span class="status-pill"><i></i> Example league · W08</span><button class="util-btn" data-nav="connect">Change league</button></div></div>${content}</main></div>`}
const section=(num,label)=>`<div class="section-label"><span>${num}</span> ${label}</div>`;
function homeA(){return `<div class="screen a-home"><header class="hero-head"><div><div class="eyebrow">POWERS–NEWLON / WEEKLY INTELLIGENCE</div><h1>A clearer view of<br>the week ahead.</h1></div><p>Model-backed perspective for your next decision. No noise, no borrowed projections.</p></header><section class="a-hero"><div><div class="eyebrow">THE MATCHUP / WEEK 08</div><h2>Your side enters the week<br>with a projected deficit.</h2><div class="a-margin display-num">−15.2</div><div class="supporting">Projected PPR margin · Current starting lineups</div></div><div class="a-versus"><div><div class="section-label">Projected totals</div><div class="a-score-line"><div><small>You</small><strong class="display-num">133.4</strong><span>Your Team</span></div><div><small>Opponent</small><strong class="display-num">148.6</strong><span>Opposing Team</span></div></div></div><p class="a-hero-note">The difference between these totals is not a win probability. All numbers are illustrative.</p></div></section><div class="a-grid"><section>${section('01','Decision worth examining')}<div class="a-story"><div class="eyebrow">START / SIT · QUARTERBACK</div><h3>A small edge at QB,<br>worth a closer look.</h3><p>Jordan Love projects 1.3 PPR points higher than Jared Goff in this illustration. The estimate is close enough that range, injury context and lineup eligibility matter.</p><div class="a-story-footer"><button class="action-btn" data-nav="decisions">Explore the decision <span>↗</span></button><span class="supporting">Model preference · not an executed lineup change</span></div></div></section><section>${section('02','Model readout')}<div class="a-micro"><span><i class="dot"></i>Forecast type</span><strong>Pregame model</strong></div><div class="a-micro"><span>Projection basis</span><strong>Current starters</strong></div><div class="a-micro"><span>Model/league data</span><strong>Separated</strong></div><div class="a-micro"><span>League source</span><strong>Sleeper</strong></div><button class="act-link" data-nav="scout">View player research ↗</button></section></div><footer class="a-bottomnote"><span>POWERS–NEWLON / STRATEGY THROUGH CLARITY</span><span>Concept fixture · no live projections</span></footer></div>`}
function homeB(){return `<div class="screen b-home"><header class="b-header"><div><div class="eyebrow">PN / STRATEGY SYSTEM / WEEK 08</div><h1>Matchup signal.</h1><p>Example League · Model forecast vs. upcoming decisions</p></div><div class="b-code">SNAPSHOT / PRE-KICKOFF<br>PROJECTION SOURCE / PN MODEL</div></header><section class="b-instrument"><div class="b-primary"><div class="eyebrow">01 / EXPECTED POINT DIFFERENCE</div><div class="b-giant display-num">−15.2<small>PPR</small></div><p>Projected deficit from the current lineup. Not a calibrated probability of winning.</p></div><div class="b-bars"><div class="b-bar"><div class="b-bar-label"><span>01 / YOUR TEAM</span><strong>133.4</strong></div><div class="b-track"><i style="width:89.8%"></i></div></div><div class="b-bar"><div class="b-bar-label"><span>02 / OPPONENT</span><strong>148.6</strong></div><div class="b-track"><i style="width:100%"></i></div></div><div class="b-code">COMMON SCALE / PROJECTED PPR POINTS</div></div></section><div class="b-sections"><section>${section('02','Decision queue')}<div class="b-table"><div class="b-row"><span class="b-index">01</span><div><h3>Quarterback comparison</h3><p>Love vs. Goff · 1.3 PPR model difference</p></div><button data-nav="decisions">Inspect ↗</button></div><div class="b-row"><span class="b-index">02</span><div><h3>Receiver volatility</h3><p>Check ceiling and downside before lock</p></div><button data-nav="scout">Inspect ↗</button></div><div class="b-row"><span class="b-index">03</span><div><h3>Roster context</h3><p>League eligibility and long-term value</p></div><button data-nav="connect">Source ↗</button></div></div></section><section>${section('03','Forecast range illustration')}<div class="b-plot"><h3>Uncertainty matters.</h3><svg viewBox="0 0 320 145" aria-label="Example projection ranges for two quarterbacks"><g stroke="currentColor" opacity=".15"><path d="M10 24H310M10 60H310M10 96H310M10 132H310"/></g><path d="M22 114L68 98L114 106L160 70L206 82L252 45L300 67" fill="none" stroke="#287eaa" stroke-width="3"/><path d="M22 130L68 112L114 116L160 104L206 108L252 90L300 102" fill="none" stroke="#86a8bc" stroke-width="3"/><circle cx="252" cy="45" r="5" fill="#287eaa"/></svg><p>Displayed bands and historical trends need labels, provenance and validation before being used for real decisions.</p></div></section></div></div>`}
function homeC(){return `<div class="screen c-home"><header class="c-head"><div><div class="eyebrow">POWERS–NEWLON / YOUR WEEK</div><h1>Make the<br><span>next move.</span></h1><p>Example League · Week 08 · Forecast briefing</p></div><div class="c-weather">01 / MOMENTUM<br>02 / YOUR OPTIONS<br>03 / THE EVIDENCE</div></header><div class="c-card"><section class="c-match"><div class="eyebrow">MATCHUP / CURRENT STARTERS</div><div class="c-scores"><div><small>YOUR TEAM</small><strong class="display-num">133.4</strong></div><span class="c-vs">VS</span><div><small>OPPONENT</small><strong class="display-num">148.6</strong></div></div><div class="c-track"><i></i></div><div style="font-size:11px;color:#c1d6cb;margin-top:13px">Share of projected PPR points · not win probability</div></section><section class="c-narrative"><div><span class="eyebrow">01 / IN FOCUS</span><h2>You're 15.2 points behind the projection.</h2><p>There is an actionable choice at quarterback. Examine the evidence before setting your lineup.</p></div><div class="c-next"><div><small>UP NEXT</small><strong>Compare quarterback options</strong></div><button aria-label="Open decisions" data-nav="decisions">↗</button></div></section></div><div class="c-focus"><section class="c-focus-main"><div><div class="eyebrow">02 / YOUR STARTING GROUP</div><h2>Players in view.</h2></div>${[['JG','Jared Goff','DET · QB','17.1'],['KW','Kenneth Walker III','KC · RB','15.4'],['JK','George Kittle','SF · TE','14.2']].map(([i,n,d,p])=>`<div class="c-chipline"><span class="initial">${i}</span><div><strong>${n}</strong><small>${d}</small></div><b>${p}</b></div>`).join('')}<button class="act-link" data-nav="scout" style="justify-self:start">Explore every player ↗</button></section><section class="c-focus-note"><span class="eyebrow">03 / INTELLIGENCE</span><h3>Explanations, not just scores.</h3><p>We should show a recommendation only when the model can identify its source, uncertainty and actual actionability within your league.</p><button class="line-btn" data-nav="decisions">Open Decision Lab ↗</button></section></div></div>`}
function decisions(){let l=pick(state.left),r=pick(state.right),delta=l.projection-r.projection;const spread=p=>{let max=32;return {left:100*p.range[0]/max,width:100*(p.range[1]-p.range[0])/max}};let a=spread(l),b=spread(r);return `<section class="screen"><header class="work-head"><div><div class="eyebrow">02 / DECISION WORKSPACE</div><h1>Compare the evidence.</h1></div><p>A recommendation is a hypothesis to test, not a command. Projected outcomes remain clearly labeled.</p></header><div class="work-grid"><section class="comparison"><div class="comp-header"><h2>Start / Sit workbench</h2><span class="tiny">PPR · Model fixture</span></div><div class="comp-selector"><label>Option A<select id="left-select" aria-label="First player">${players.map(x=>`<option value="${x.id}" ${x.id===l.id?'selected':''}>${safe(x.name)}</option>`).join('')}</select></label><label>Option B<select id="right-select" aria-label="Second player">${players.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${safe(x.name)}</option>`).join('')}</select></label></div><div class="comp-delta"><strong class="display-num">${delta>0?'+':''}${f(delta)}</strong><div><span>MODEL DIFFERENCE / PPR</span><small>${delta===0?'Equal estimates':delta>0?`${safe(l.name)} projects higher`:`${safe(r.name)} projects higher`}</small></div></div><div><div class="eyebrow">ILLUSTRATIVE MODEL RANGES</div><div class="spread"><span class="spread-label one">${safe(l.name)} / ${f(l.projection)}</span><div class="spread-line" style="left:${a.left}%;width:${a.width}%"><i></i></div><span class="spread-label two">${safe(r.name)} / ${f(r.projection)}</span><div class="spread-line alt" style="left:${b.left}%;width:${b.width}%"><i></i></div></div></div><div class="comp-foot">The projected difference is small and uncertain. Availability, league eligibility, kickoff lock and player-specific context must be checked before acting.</div><div style="display:flex;align-items:center;gap:13px;flex-wrap:wrap"><button class="action-btn" id="review-btn">${state.reviewed?'Marked for review ✓':'Mark for review ↗'}</button><span class="reviewed-note">${state.reviewed?'Saved to this preview session':'No transaction will be made'}</span></div></section><aside class="evidence"><div class="eyebrow">MODEL CONTEXT / PROVENANCE</div><h2>What drives the choice?</h2><div class="evi-row"><small>01 / Volume</small><strong>Expected opportunity</strong><p>Share of attempts or touches, recent participation and matchup environment.</p></div><div class="evi-row"><small>02 / Outcome</small><strong>Production range</strong><p>Projection intervals communicate uncertainty; they are not a guarantee.</p></div><div class="evi-row"><small>03 / Constraints</small><strong>Actual lineup eligibility</strong><p>Confirm league lineup slots, player availability and start times before any decision.</p></div><button class="act-link" data-nav="scout" style="justify-self:start">Open player research ↗</button></aside></div></section>`}
function scoutRows(){const q=state.query.trim().toLowerCase();let list=players.filter(p=>(state.filter==='ALL'||state.filter===p.pos)&&p.name.toLowerCase().includes(q));return list.length?list.map(p=>`<button class="scout-row" data-player="${p.id}"><span class="id">${p.pos}</span><span class="name">${safe(p.name)}<small>${p.club} · vs ${p.opponent}</small></span>${sparkTrend(p.trend)}<span class="proj">${f(p.projection)}</span><span class="arrow">↗</span></button>`).join(''):'<div class="supporting" style="padding:23px 4px">No players match this search.</div>'}
function scout(){return `<section class="screen"><header class="work-head"><div><div class="eyebrow">03 / RESEARCH LIBRARY</div><h1>Read the players.</h1></div><p>Model projections, historical context, and uncertainty—without a feed of fantasy noise.</p></header><div class="scout-controls"><input type="search" id="scout-search" value="${safe(state.query)}" placeholder="Search player name" aria-label="Search player name" autocomplete="off"><div class="filters" role="group" aria-label="Position filters">${['ALL','QB','RB','WR','TE'].map(p=>`<button class="${p===state.filter?'active':''}" data-filter="${p}">${p==='ALL'?'All':p}</button>`).join('')}</div></div><div class="scout-th"><span>POS</span><span>PLAYER / MATCHUP</span><span>RECENT TREND</span><span style="text-align:right">PROJECTED</span><span></span></div><div class="scout-table" id="scout-results">${scoutRows()}</div><p class="scout-legend">Sample projections in PPR for layout evaluation only. Clicking a player opens a dossier.</p></section>`}
function connect(){return `<section class="screen connect-wrap"><header class="work-head"><div><div class="eyebrow">00 / FIRST-RUN WORKFLOW</div><h1>Start with your league.</h1></div><p>Forms remain mounted while you type. This prototype simulates discovery; production will use validated Sleeper data.</p></header><section class="connect-card"><div class="eyebrow">SLEEPER · READ-ONLY CONNECTION</div><h2>Find your leagues</h2><p>Enter your Sleeper username and season. No account password required.</p><form id="connect-form"><div class="connect-fields"><label>Sleeper username<input id="username" name="username" type="text" value="${safe(state.username)}" placeholder="Your Sleeper username" autocomplete="username" autocapitalize="off" required></label><label>Season<input id="season" name="season" type="number" value="${safe(state.season)}" min="2020" max="2100" required></label><button type="submit" class="action-btn">Preview league discovery ↗</button></div></form>${state.connected?`<div class="connect-success"><div class="eyebrow">DEMONSTRATION RESULT</div><h3>One example league found</h3><button data-nav="home"><span>${safe(state.username)} / Example League<br><small class="tiny">Fixture only · no Sleeper request was sent</small></span><span>Continue ↗</span></button></div>`:''}<p class="connect-note">This comparison preview is offline and uses example data. The new production application's connection screen will communicate loading, errors, stale data and retries without replacing focused inputs.</p></section></section>`}
function dossier(){if(!state.sheet)return '';const p=pick(state.sheet);return `<div class="inspect-backdrop" id="inspect-backdrop" role="presentation"><section class="inspector" role="dialog" aria-modal="true" aria-labelledby="inspector-title"><div class="inspector-top"><div class="eyebrow">PLAYER DOSSIER / ${p.pos} · ${p.club}</div><button class="close-inspector" id="close-inspector" aria-label="Close player dossier">×</button></div><h2 id="inspector-title">${safe(p.name)}</h2><p>${p.club} · vs ${p.opponent} · Model forecast</p><div class="inspector-number">${f(p.projection)}<small> PPR projected</small></div>${section('01','Outcomes')}<div class="inspector-stats"><div class="inspector-stat"><span>Illustrative range</span><strong>${f(p.range[0])}–${f(p.range[1])}</strong></div><div class="inspector-stat"><span>Historical actual PPG</span><strong>${f(p.actual)}</strong></div><div class="inspector-stat"><span>Model confidence</span><strong>${p.confidence}</strong></div><div class="inspector-stat"><span>Data source</span><strong>Powers–Newlon (fixture)</strong></div></div><div style="margin-top:28px">${section('02','Recent week pattern')}${sparkTrend(p.trend)}</div><div style="margin-top:28px">${section('03','Why this forecast')}<p>${safe(p.notes)}</p></div><div class="inspector-actions"><button class="action-btn" id="compare-player">Compare in lab ↗</button><button class="line-btn" id="close-inspector-secondary">Close</button></div></section></div>`}
function render(){const root=$('#app');root.dataset.concept=state.concept;const content=state.screen==='home'?(state.concept==='a'?homeA():(state.concept==='b'||state.concept==='d')?homeB():homeC()):state.screen==='decisions'?decisions():state.screen==='scout'?scout():connect();root.innerHTML=shell(content)+dossier();$$('[data-concept-select]').forEach(b=>{b.classList.toggle('active',b.dataset.conceptSelect===state.concept);b.setAttribute('aria-pressed',b.dataset.conceptSelect===state.concept?'true':'false')});$('.review-meta b').textContent={a:'01 / 03',b:'02 / 03',c:'03 / 03',d:'ATLAS × MONOGRAPH'}[state.concept];}
function navigate(page){state.screen=page;state.sheet=null;render();window.scrollTo({top:0,behavior:'instant'})}
let previousFocus=null;
function openSheet(id){previousFocus=document.activeElement;state.sheet=id;const root=$('#app');root.insertAdjacentHTML('beforeend',dossier());$('#close-inspector').focus({preventScroll:true})}
function closeSheet(){state.sheet=null;$('#inspect-backdrop')?.remove();if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});previousFocus=null}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target){if(e.target.id==='inspect-backdrop')closeSheet();return}if(target.dataset.conceptSelect){state.concept=target.dataset.conceptSelect;render();return}if(target.dataset.nav){navigate(target.dataset.nav);return}if(target.dataset.player){openSheet(target.dataset.player);return}if(target.dataset.filter){state.filter=target.dataset.filter;$$('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.filter));$('#scout-results').innerHTML=scoutRows();return}if(target.id==='review-btn'){state.reviewed=!state.reviewed;target.textContent=state.reviewed?'Marked for review ✓':'Mark for review ↗';$('.reviewed-note').textContent=state.reviewed?'Saved to this preview session':'No transaction will be made';return}if(target.id==='close-inspector'||target.id==='close-inspector-secondary'){closeSheet();return}if(target.id==='compare-player'){state.left=state.sheet;closeSheet();navigate('decisions');return}});
document.addEventListener('input',e=>{if(e.target.id==='scout-search'){state.query=e.target.value;$('#scout-results').innerHTML=scoutRows()}if(e.target.id==='username')state.username=e.target.value;if(e.target.id==='season')state.season=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='left-select'){state.left=e.target.value;render()}if(e.target.id==='right-select'){state.right=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='connect-form'){e.preventDefault();const username=$('#username').value.trim(),year=$('#season').value;state.username=username;state.season=year;if(!username)return;state.connected=true;const result=document.createElement('div');result.className='connect-success';result.innerHTML=`<div class="eyebrow">DEMONSTRATION RESULT</div><h3>One example league found</h3><button data-nav="home"><span>${safe(username)} / Example League<br><small class="tiny">Fixture only · no Sleeper request was sent</small></span><span>Continue ↗</span></button>`;$('.connect-success')?.remove();$('.connect-card form').after(result)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){e.preventDefault();closeSheet()}else if(e.key==='Tab'&&state.sheet){let els=$$('.inspector button,.inspector input,.inspector select').filter(x=>!x.disabled),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script>
</body>
