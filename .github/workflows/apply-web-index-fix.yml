name: Apply Web 1.1 projection index fix

on:
  push:
    branches: [main]
    paths:
      - '.github/web-index-fix-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main.js
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/src/main.js')
          text = path.read_text(encoding='utf-8')

          old_state = "const st={route:localStorage.fm_route||'dashboard',tab:localStorage.fm_league_tab||'home',nav:false,username:localStorage.fm_username||'',season:+(localStorage.fm_season||new Date().getFullYear()),user:null,leagues:[],league:null,users:[],rosters:[],matchups:[],picks:[],players:null,week:null,team:null,snapshot:{},rows:[],games:[],tradeA:null,tradeB:null,assetsA:new Set,assetsB:new Set,compare:[],loading:false,error:''};"
          new_state = "const st={route:localStorage.fm_route||'dashboard',tab:localStorage.fm_league_tab||'home',nav:false,username:localStorage.fm_username||'',season:+(localStorage.fm_season||new Date().getFullYear()),user:null,leagues:[],league:null,users:[],rosters:[],matchups:[],picks:[],players:null,week:null,team:null,snapshot:{},rows:[],modelById:new Map,modelByName:new Map,pickValues:new Map,games:[],tradeA:null,tradeB:null,assetsA:new Set,assetsB:new Set,compare:[],loading:false,error:''};"

          old_lookup = """function flatten(x,out=[],d=0){if(d>8||x==null)return out;if(Array.isArray(x)){for(const z of x){if(z&&typeof z==='object'&&!Array.isArray(z)){const k=Object.keys(z).map(q=>q.toLowerCase());if(k.some(q=>['player_id','sleeper_id','player_name','full_name','name'].includes(q)))out.push(z)}flatten(z,out,d+1)}}else if(typeof x==='object')for(const z of Object.values(x))flatten(z,out,d+1);return out}
function field(r,keys){if(!r)return null;for(const q of keys){const k=Object.keys(r).find(x=>x.toLowerCase()===q.toLowerCase());if(k&&r[k]!=null&&r[k]!=='')return r[k]}return null}
async function snapshot(){st.snapshot=await json('/data/model_snapshot.json',{})||{};st.rows=flatten(st.snapshot)}
function model(id,p=st.players?.[id],week=st.week){const name=p?.full_name||[p?.first_name,p?.last_name].filter(Boolean).join(' ');const rs=st.rows.filter(r=>{const rid=field(r,['player_id','sleeper_id','sleeper_player_id','gsis_id']),rn=field(r,['player_name','full_name','name','player']);return rid!=null&&String(rid)===String(id)||name&&rn&&String(rn).toLowerCase()===name.toLowerCase()});const r=rs.find(r=>+field(r,['week','game_week','target_week'])===+week)||rs[0];return{projection:n(field(r,['live_projection','current_projection','projected_points','projection','proj_fpts','fpts_proj','pred','prediction','mean','weekly_projection'])),pregame:n(field(r,['pregame_projection','original_projection','base_projection','neutral_projection','projected_points','projection'])),floor:n(field(r,['floor','projection_floor','p10','lower','lower_bound'])),ceiling:n(field(r,['ceiling','projection_ceiling','p90','upper','upper_bound'])),avg:n(field(r,['avg_ppg','ppg','fantasy_ppg','season_ppg','current_avg_ppg'])),dynasty:n(field(r,['dynasty_value','dynasty','asset_value','value','dynasty_score'])),confidence:field(r,['confidence','projection_confidence','conf','confidence_score']),opp:field(r,['opponent','opp','opponent_team','opp_team'])}}
"""

          new_lookup = """function field(r,keys){if(!r)return null;for(const q of keys){const k=Object.keys(r).find(x=>x.toLowerCase()===q.toLowerCase());if(k&&r[k]!=null&&r[k]!=='')return r[k]}return null}
function normName(v){return String(v??'').normalize('NFKD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[.’']/g,'').replace(/[-_]/g,' ').replace(/\\b(jr|sr|ii|iii|iv|v)\\b/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\\s+/g,' ')}
function addName(k,e){if(!k)return;const a=st.modelByName.get(k)||[];if(!a.includes(e))a.push(e);st.modelByName.set(k,a)}
function buildModelIndex(s){st.modelById=new Map;st.modelByName=new Map;st.pickValues=new Map;const ps=Array.isArray(s?.players)?s.players:Object.values(s?.players||{});st.rows=ps;for(const base of ps){if(!base||typeof base!=='object')continue;const weeks=new Map;for(const w of Array.isArray(base.weekly_projections)?base.weekly_projections:[]){const wk=n(field(w,['week','game_week','target_week']));if(wk!=null)weeks.set(+wk,w)}const e={base,weeks};for(const v of [base.sleeper_id,base.sleeper_player_id,base.player_id,base.gsis_id])if(v!=null&&v!=='')st.modelById.set(String(v),e);for(const v of [base.player_name,base.full_name,base.name])addName(normName(v),e)}for(const r of Array.isArray(s?.pick_values)?s.pick_values:[]){const y=n(field(r,['season','pick_year','year'])),rd=n(field(r,['round','pick_round'])),v=n(field(r,['dynasty_value','value','asset_value','pick_value']));if(y!=null&&rd!=null&&v!=null)st.pickValues.set(`${y}:${rd}`,v)}}
function resolveModel(id,p){for(const v of [id,p?.sleeper_id,p?.player_id,p?.gsis_id]){if(v!=null&&v!==''&&st.modelById.has(String(v)))return st.modelById.get(String(v))}const name=normName(p?.full_name||[p?.first_name,p?.last_name].filter(Boolean).join(' '));const c=st.modelByName.get(name)||[];if(c.length<=1)return c[0]||null;const pos=String(p?.position||'').toUpperCase(),team=String(p?.team||'').toUpperCase();return c.find(x=>String(field(x.base,['position'])||'').toUpperCase()===pos&&String(field(x.base,['team'])||'').toUpperCase()===team)||c.find(x=>String(field(x.base,['position'])||'').toUpperCase()===pos)||c[0]}
async function snapshot(){st.snapshot=await json('/data/model_snapshot.json',{})||{};buildModelIndex(st.snapshot)}
function model(id,p=st.players?.[id],week=st.week){const e=resolveModel(id,p),base=e?.base||null,w=e?.weeks?.get(+week)||null,current=+st.snapshot?.projection_week===+week;const weekField=keys=>field(w,keys)??(current?field(base,keys):null);return{projection:n(weekField(['live_projection','current_projection','projected_points','projection','proj_fpts','fpts_proj','pred','prediction','mean','weekly_projection'])),pregame:n(weekField(['pregame_projection','original_projection','base_projection','neutral_projection','projected_points','projection'])),floor:n(weekField(['floor','projection_floor','p10','lower','lower_bound'])),ceiling:n(weekField(['ceiling','projection_ceiling','p90','upper','upper_bound'])),avg:n(field(w,['avg_ppg','ppg','fantasy_ppg','season_ppg','current_avg_ppg'])??field(base,['avg_ppg','ppg','fantasy_ppg','season_ppg','current_avg_ppg'])),dynasty:n(field(base,['dynasty_value','dynasty','asset_value','value','dynasty_score'])??field(w,['dynasty_value','dynasty','asset_value','value','dynasty_score'])),confidence:weekField(['confidence','projection_confidence','conf','confidence_score']),opp:weekField(['opponent','opp','opponent_team','opp_team']),matched:!!e,hasWeek:!!w}}
function auditProjections(){if(!st.rosters?.length||!st.players)return;const ids=[...new Set(st.rosters.flatMap(r=>r.players||[]))].filter(id=>['QB','RB','WR','TE'].includes(String(st.players?.[id]?.position||'').toUpperCase())),unmatched=[],missing=[];for(const id of ids){const m=model(id,st.players[id]);if(!m.matched)unmatched.push(pname(id));else if(m.projection==null)missing.push(pname(id))}console.info('[Fantasy Model] projection coverage',{week:st.week,total:ids.length,projected:ids.length-unmatched.length-missing.length,unmatched,missing})}
"""

          old_pick = "function pickVal(p){const r=st.rows.find(x=>+field(x,['season','pick_year','year'])===+p.season&&+field(x,['round','pick_round'])===+p.round&&String(field(x,['asset_type','type','kind'])||'').toLowerCase().includes('pick')),v=n(field(r,['dynasty_value','value','asset_value','pick_value']));if(v!=null)return v;return Math.round(({1:4200,2:1800,3:800,4:350}[p.round]||100)*Math.pow(.92,Math.max(0,p.season-st.season-1)))}"
          new_pick = "function pickVal(p){const v=st.pickValues.get(`${+p.season}:${+p.round}`);if(v!=null)return v;return Math.round(({1:4200,2:1800,3:800,4:350}[p.round]||100)*Math.pow(.92,Math.max(0,p.season-st.season-1)))}"

          old_open = "st.tradeB=st.rosters.find(r=>r.roster_id!==st.tradeA)?.roster_id;st.loading=false;render()}"
          new_open = "st.tradeB=st.rosters.find(r=>r.roster_id!==st.tradeA)?.roster_id;st.loading=false;auditProjections();render()}"
          old_week = "async function setWeek(w){st.week=+w;if(st.league)st.matchups=await json(`${S}/league/${st.league.league_id}/matchups/${w}`,[])||[];render()}"
          new_week = "async function setWeek(w){st.week=+w;if(st.league)st.matchups=await json(`${S}/league/${st.league.league_id}/matchups/${w}`,[])||[];auditProjections();render()}"

          replacements = [(old_state,new_state),(old_lookup,new_lookup),(old_pick,new_pick),(old_open,new_open),(old_week,new_week)]
          for old,new in replacements:
              if old not in text:
                  raise SystemExit('Expected source block was not found; refusing partial patch.')
              text = text.replace(old,new,1)

          path.write_text(text,encoding='utf-8')
      - name: Commit optimized lookup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/main.js
          git commit -m "Index Web 1.1 player projections for fast lookup"
          git push
