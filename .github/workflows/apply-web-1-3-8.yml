name: Apply Web 1.3.8 Start Sit

on:
  push:
    paths:
      - '.github/web-1-3-8-trigger'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch_web_1_3_8.py
      - name: JavaScript syntax check
        run: node --check web/src/main.js
      - name: Build exactly as Cloudflare Pages
        run: npm run build
      - name: Verify Pages output
        run: |
          test -f dist/index.html
          test -d dist/assets
      - name: Commit production feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/main.js web/src/styles.css web/package.json
          git commit -m "Upgrade Start Sit decision analysis"
          git push
