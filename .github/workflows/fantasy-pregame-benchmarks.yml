name: Fantasy Model 3.1 pregame benchmarks

on:
  push:
    branches:
      - fm-3-1-benchmark-archive
  workflow_dispatch:
  schedule:
    # Thursday Night Football - both EDT and EST windows
    - cron: '45 23 * * 4'
    - cron: '45 0 * * 5'

    # Sunday international / early windows
    - cron: '15 13 * * 0'
    - cron: '15 14 * * 0'

    # Sunday 1 PM ET - both EDT and EST windows
    - cron: '45 16 * * 0'
    - cron: '45 17 * * 0'

    # Sunday late-afternoon window - both EDT and EST
    - cron: '45 19 * * 0'
    - cron: '15,45 20 * * 0'
    - cron: '15 21 * * 0'

    # Sunday Night Football - both EDT and EST
    - cron: '45 23 * * 0'
    - cron: '45 0 * * 1'
    - cron: '45 1 * * 1'

    # Monday Night Football - both EDT and EST / early doubleheaders
    - cron: '45 22 * * 1'
    - cron: '45 23 * * 1'
    - cron: '45 0 * * 2'
    - cron: '45 1 * * 2'

permissions:
  contents: write

concurrency:
  group: fantasy-model-production-state
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Fantasy Model
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install benchmark dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::readr
            any::tidyr
            any::tibble
            any::purrr
            any::jsonlite
            any::nflreadr
            any::httr2
          cache-version: 1

      - name: Check benchmark archive integrity
        run: Rscript tests/TEST_3_1_BENCHMARK_ARCHIVE.R

      - name: Capture latest pregame benchmarks
        env:
          FM_RELEASE_VERSION: '3.1'
        run: Rscript runners/RUN_3_1_BENCHMARK_ARCHIVE.R

      - name: Commit benchmark archive state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            output/benchmark_pregame_archive_*.csv \
            output/benchmark_provider_status_*.csv \
            output/benchmark_snapshot_manifest_*.csv \
            output/benchmark_scored_long_*.csv \
            output/benchmark_metrics_*.csv \
            output/benchmark_paired_*.csv \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi

          git commit -m "Archive latest pregame benchmark projections"

          if [[ -n "$(git status --porcelain)" ]]; then
            git stash push --include-untracked -m "benchmark-runtime-leftovers"
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
