<html lang="en">
<head>

  <style>
/* POWERS–NEWLON / THE FIELDNOTE SYSTEM
   Product design prototype v0.1 — deliberately NOT a style override of the production UI.
   One spacing scale, one typography system, no external fonts or frameworks. */
:root{
  color-scheme:light;
  --paper:#f2f1ec;--cream:#e9e8e0;--white:#fffefa;--ink:#20302f;--deep:#173b3b;
  --darkest:#132b2c;--text:#273634;--muted:#66736e;--light-muted:#89958d;
  --hair:#d8dcd5;--mint:#e4eee7;--clay:#cb6748;--soft-clay:#f4e7dc;--green:#286f61;
  --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--rail:244px;
}
*{box-sizing:border-box}
html{font-size:16px;background:var(--paper);scroll-behavior:smooth}
body{margin:0;min-width:320px;color:var(--ink);background:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button,select,input{outline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--clay)}
button:disabled{cursor:not-allowed}
h1,h2,h3,p{margin-top:0}a{color:inherit}
svg{flex:none}
::selection{background:#d4e4dc;color:#122827}
.skip-link{position:fixed;z-index:1000;top:-75px;left:20px;background:white;color:var(--ink);padding:12px 18px;border:2px solid var(--clay)}
.skip-link:focus{top:12px}
.workspace{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{height:100dvh;position:sticky;top:0;display:flex;flex-direction:column;padding:34px 20px 27px 24px;background:#e9e9e1;border-right:1px solid #d4d9d2}
.mark{display:flex;gap:11px;align-items:center;margin-bottom:91px}
.mark-symbol{width:55px;height:55px;border:1.5px solid #2f5049;display:flex;align-items:center;justify-content:center;gap:1px;color:#21493f;font-size:21px;font-family:var(--serif);letter-spacing:-.05em}
.mark-symbol b{font-size:12px;font-weight:400;padding:0 1px;color:var(--clay)}
.mark-title{font-size:11px;line-height:1.25;font-weight:800;letter-spacing:.02em}
.mark-title small{display:block;margin-top:6px;max-width:104px;font-size:8px;color:var(--muted);letter-spacing:.1em;font-weight:650;line-height:1.55}
.rail-label,.rail-number,.rail-note-line,.rail-stamp,.rail-note-bottom{font-size:9px;letter-spacing:.13em;font-weight:750}
.rail-label{padding:0 8px 14px;color:#859086}
.rail-nav{border-top:1px solid #ced5cb}
.rail-link{width:100%;display:grid;grid-template-columns:24px 1fr 16px;align-items:center;gap:9px;height:63px;text-align:left;padding:0 8px;border:0;border-bottom:1px solid #d2d8d1;background:transparent;color:#53655d;transition:color .15s,background .18s}
.rail-number{font-size:10px;color:#9ba99e}
.rail-link>span:nth-child(2){font-size:13px;letter-spacing:-.01em;font-weight:650}
.rail-arrow{opacity:0;transform:translateX(-5px);transition:opacity .2s,transform .2s;color:var(--clay)}
.rail-link:hover{background:rgba(255,255,255,.35);color:var(--ink)}
.rail-link:hover .rail-arrow,.rail-link.active .rail-arrow{opacity:1;transform:translateX(0)}
.rail-link.active{color:var(--ink);font-weight:800}
.rail-link.active .rail-number{color:var(--clay)}
.rail-link.active>span:nth-child(2){font-weight:800}
.rail-note{margin-top:auto;padding:21px 10px 0;border-top:1px solid #d0d6cd}
.rail-note-line{display:flex;align-items:center;gap:5px;color:#386657;font-size:8px;white-space:nowrap}
.signal-dot{display:inline-block;width:6px;height:6px;background:#3c8d71;border-radius:50%;vertical-align:middle;flex:none}
.rail-stamp{color:#919d92;font-size:7px;margin-left:auto;white-space:nowrap}
.rail-note p{font-family:var(--serif);font-style:italic;font-size:20px;color:#43574e;line-height:1.34;margin:18px 0 22px}
.rail-note-bottom{font-size:9px;color:#8b9a8d}
.main-column{min-width:0;display:flex;flex-direction:column}
.topline{height:76px;min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:0 clamp(24px,4vw,68px);border-bottom:1px solid var(--hair);background:rgba(242,241,236,.94);position:sticky;top:0;z-index:8;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.topline-left,.topline-right{display:flex;align-items:center;min-width:0;gap:14px}
.topline-left{font-size:11px;font-weight:620;color:#76847a;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topline-left>span:last-child{overflow:hidden;text-overflow:ellipsis}
.topline-overline{font-weight:800;letter-spacing:.1em;color:#405b4f}
.topline-div{width:1px;height:14px;background:#c9d1c8;flex:none}
.topline-right{flex:none}
.demo-pill{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.1em;color:#506f60;font-weight:800;white-space:nowrap}
.demo-pill span{width:7px;height:7px;border-radius:50%;background:var(--clay)}
.icon-button{display:grid;place-items:center;width:37px;height:37px;border:1px solid #d6ded5;background:transparent;border-radius:50%;color:#4c6659;transition:background .2s}
.icon-button:hover{background:#e7e9df}
.mobile-mark{display:none}
.view-wrap{flex:1;width:100%;padding:52px clamp(24px,4vw,68px) 100px}
.page-enter{width:100%;max-width:1350px;margin:0 auto}
.eyebrow{display:block;font-size:10px;letter-spacing:.16em;font-weight:830;color:var(--green);text-transform:uppercase;line-height:1.5}
.display-title{font-family:var(--serif);font-weight:400;letter-spacing:-.055em;font-size:clamp(59px,6.7vw,103px);line-height:.94;color:var(--ink);margin:20px 0 19px}
.display-title em{font-weight:400;font-style:italic;color:#53685c}
.intro-description{font-size:15px;color:#748178;line-height:1.5;max-width:440px;margin:0}
.intro-grid{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:end;margin-bottom:48px}
.intro-meta{display:grid;align-content:end;padding:0 0 8px 20px}
.meta-top{font-size:13px;color:#64776c;display:flex;align-items:baseline;justify-content:space-between;letter-spacing:.11em;font-weight:750}
.meta-top strong{font-size:72px;line-height:.9;font-weight:450;color:var(--ink);font-family:var(--serif);letter-spacing:-.08em}
.meta-rule{height:1px;background:#aab8ad;margin:17px 0 13px}
.meta-bottom,.meta-foot{display:flex;justify-content:space-between;gap:10px;font-size:9px;color:#809085;letter-spacing:.1em;font-weight:750}
.meta-bottom b,.meta-foot strong{color:#46584d}
.meta-foot{margin-top:19px}
.briefing-hero{background:#1e4040;color:#fafbf7;overflow:hidden;position:relative;isolation:isolate}
.briefing-hero:before{content:'';position:absolute;z-index:-1;pointer-events:none;width:700px;height:700px;right:-340px;top:-440px;border:1px solid rgba(222,240,232,.14);border-radius:50%;box-shadow:0 0 0 92px rgba(222,240,232,.021),0 0 0 175px rgba(222,240,232,.02)}
.hero-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:30px 36px 0;font-size:10px;letter-spacing:.15em;font-weight:770;color:#b8d1c7}
.hero-status{display:flex;gap:8px;align-items:center;white-space:nowrap;color:#bed3cb}
.hero-status i{display:block;width:7px;height:7px;background:#b7d6b9;border-radius:50%}
.match-layout{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);gap:18px;padding:58px 50px 54px}
.score-team{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.score-team.right{align-items:flex-end;text-align:right}
.score-team>span,.score-team>small{font-size:10px;letter-spacing:.14em;font-weight:750;color:#b4cfc5}
.score-team h2{font-size:clamp(14px,1.65vw,21px);font-weight:650;letter-spacing:-.015em;line-height:1.3;min-height:51px;margin:13px 0 25px;max-width:290px}
.score-team strong{font-size:clamp(64px,7.3vw,105px);font-weight:400;font-family:var(--serif);line-height:.95;letter-spacing:-.075em;font-variant-numeric:tabular-nums;color:#fafcf9}
.score-team>small{margin-top:13px}
.match-center{position:relative;display:flex;align-items:center;justify-content:center;align-self:stretch;margin-top:16px}
.match-centermark{width:1px;background:rgba(229,244,238,.18);height:100%;min-height:170px;position:absolute;left:50%;top:0}
.match-vs{font-size:12px;font-family:var(--serif);font-style:italic;z-index:1;background:#214343;padding:10px;color:#c4ddd1}
.hero-foot{display:grid;grid-template-columns:190px minmax(0,1fr) auto;gap:25px;align-items:center;padding:29px 36px 31px;border-top:1px solid rgba(219,240,233,.18);background:rgba(10,34,34,.23)}
.hero-metric>span{display:block;color:#b4c9bd;font-size:9px;letter-spacing:.15em;font-weight:760;margin-bottom:8px}
.hero-metric>strong{font-size:32px;font-family:var(--serif);font-weight:450;line-height:1;color:#fafbf6;letter-spacing:-.04em}
.hero-metric>strong small{font-size:12px;font-family:var(--sans);letter-spacing:.08em;color:#c9d7cf}
.hero-foot-text{color:#b9cfc5;font-size:12px;line-height:1.65;max-width:270px}
.hero-foot-text span{color:#fff}
.hero-link{display:flex;align-items:center;gap:13px;justify-content:space-between;min-height:46px;padding:0 0 6px;background:none;color:#f9f9f2;border:0;border-bottom:1px solid rgba(222,242,235,.38);font-size:12px;font-weight:740;white-space:nowrap;transition:gap .2s}
.hero-link:hover{gap:19px}
.briefing-grid{display:grid;grid-template-columns:1fr 1fr;gap:42px;margin-top:65px}
.section-hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;padding-bottom:19px;border-bottom:1px solid #bfcac1;margin-bottom:24px}
.section-hdr>div{display:flex;align-items:baseline;gap:14px;min-width:0}
.section-hdr .section-number{font-family:var(--serif);font-size:15px;color:var(--clay);font-style:italic}
.section-hdr h2{margin:0;font-family:var(--serif);font-weight:450;font-size:clamp(24px,2.6vw,34px);letter-spacing:-.045em;color:var(--ink)}
.section-aside{font-size:8.5px;letter-spacing:.11em;font-weight:760;color:#89968b;white-space:nowrap}
.priority-block{display:grid;grid-template-columns:4px 1fr;min-height:319px;gap:24px;background:#eceae2;padding:24px 27px 27px 0}
.priority-rule{background:var(--clay);width:4px;height:100%}
.priority-body{display:flex;flex-direction:column;padding-right:2px}
.priority-tag{font-size:10px;color:#b96b51;letter-spacing:.11em;font-weight:800;margin-bottom:16px}
.priority-body h3{font-family:var(--serif);font-size:clamp(31px,3.2vw,45px);font-weight:400;line-height:1.06;letter-spacing:-.048em;margin:0 0 13px}
.priority-body h3 em{font-style:italic;color:#627567}
.priority-body p{font-size:12px;line-height:1.7;color:#69766c;max-width:420px;margin-bottom:29px}
.priority-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}
.priority-footer>span{font-size:9px;letter-spacing:.07em;color:#818f83;font-weight:740;white-space:nowrap}
.priority-footer>span b{color:#b45e43;font-weight:800}
.priority-footer button{display:flex;align-items:center;gap:8px;background:transparent;border:0;border-bottom:1px solid #bdcabf;padding:9px 0;color:#30564b;font-size:10px;font-weight:800;white-space:nowrap}
.radar-list{display:flex;flex-direction:column}
.radar-row{width:100%;display:grid;grid-template-columns:25px 1fr auto 16px;align-items:center;gap:12px;border:0;border-bottom:1px solid #d3d9d0;background:transparent;text-align:left;min-height:70px;padding:12px 2px;color:#35483f}
.radar-row:first-child{border-top:1px solid #d3d9d0}
.radar-row>span{font-family:var(--serif);font-size:14px;color:#af6852;font-style:italic}
.radar-row strong{font-size:13px;font-weight:660;line-height:1.3}
.radar-row i{font-size:12px;font-style:normal;color:#4c7464;font-weight:750;white-space:nowrap}
.radar-row svg{color:#97a99a;transition:transform .16s}
.radar-row:hover svg{transform:translateX(3px)}
.model-source{display:flex;align-items:center;gap:9px;color:#78877a;font-size:8px;letter-spacing:.09em;font-weight:750;margin-top:31px}
.model-source .source-v{margin-left:auto;color:#a1aca0}
.bottom-teaser{margin-top:64px}
.exposure-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.exposure-item{background:transparent;border:1px solid #cbd6ca;padding:21px 20px 19px;min-height:182px;display:flex;flex-direction:column;text-align:left;transition:background .18s,border-color .18s}
.exposure-item:hover{background:#e9ece5;border-color:#a7b8ab}
.exposure-top,.exposure-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.exposure-top{font-size:10px;color:#9aada0}
.exposure-top i{font-style:normal;color:#517669;font-size:10px;letter-spacing:.1em;font-weight:800}
.exposure-item>strong{display:block;font-size:15px;line-height:1.2;margin-top:17px;font-weight:720;color:var(--ink);min-height:35px}
.exposure-bar{height:4px;background:#dce3d9;margin-top:auto;margin-bottom:10px;overflow:hidden}
.exposure-bar span{height:100%;display:block;background:#597f6b}
.exposure-foot small{font-size:10px;color:#899689}
.exposure-foot b{font-size:19px;font-weight:530;font-family:var(--serif);color:#2a5c4a}
.page-header{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(210px,.5fr);align-items:end;gap:28px;margin:6px 0 47px}
.page-header .display-title{margin:20px 0 0}
.page-header p{color:#78877c;font-size:14px;line-height:1.65;margin:0 0 8px;max-width:290px}
.lab-workbench{background:#fffefa;border:1px solid #d6ded4}
.lab-workbench-header{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #dce2d8;padding:22px 26px;font-size:9px;letter-spacing:.14em;color:#66796d;font-weight:780}
.lab-workbench-header span:last-child{color:#a2ada2}
.compare-grid{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);padding:42px 42px 46px;gap:25px}
.compare-person{min-width:0;display:flex;flex-direction:column}
.compare-person>label{font-size:10px;letter-spacing:.13em;font-weight:800;color:#7f9185;margin-bottom:10px}
.compare-person>select{width:100%;border:0;border-bottom:1px solid #c8d4c7;color:#203e33;padding:10px 21px 13px 0;font-size:17px;font-weight:720;background:transparent;border-radius:0;appearance:auto}
.compare-stat{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:27px 0 22px}
.compare-stat strong{font-family:var(--serif);font-weight:400;color:#273f37;font-size:clamp(58px,6vw,93px);line-height:.9;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.compare-stat small{font-size:9px;letter-spacing:.12em;font-weight:800;color:#97a69b;max-width:73px;text-align:right;line-height:1.5}
.spark{display:block;width:100%;overflow:visible}
.compare-foot{display:flex;justify-content:space-between;gap:8px;margin-top:15px;padding-top:13px;border-top:1px solid #dce4dc;color:#809083;font-size:11px}
.compare-foot b{color:#4f7664;font-weight:730}
.compare-divider{display:grid;place-items:center;position:relative;color:#93a396;font-size:9px;letter-spacing:.14em;font-weight:800}
.compare-divider:before{content:'';position:absolute;height:100%;width:1px;background:#e0e7df}
.compare-divider span{z-index:1;transform:rotate(-90deg);background:#fffefa;padding:13px 4px}
.decision-result{display:grid;grid-template-columns:minmax(0,1fr) 158px;gap:25px;align-items:center;background:#e9efe7;padding:29px 42px 32px}
.decision-result>div:first-child>span{font-size:9px;letter-spacing:.13em;font-weight:800;color:#477365}

.result-delta strong{font-size:55px;line-height:1.1;font-family:var(--serif);font-weight:400;letter-spacing:-.06em}
.result-delta span{color:#799687}
.lab-bottom{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:40px;margin-top:70px;align-items:start}
.action-line{display:grid;grid-template-columns:29px minmax(0,1fr) 90px;gap:14px;min-height:155px;padding:22px 3px 23px;border-bottom:1px solid #d2dbd2}
.action-line:first-child{border-top:1px solid #d2dbd2}
.action-line-index{font-family:var(--serif);color:#ba7156;font-size:16px;font-style:italic}
.action-overline{font-size:9px;color:#79917e;font-weight:770;letter-spacing:.075em;text-transform:uppercase;margin-bottom:12px}
.bullet{padding:0 5px;color:#b1bdb0}
.action-line h3{font-size:17px;font-weight:740;letter-spacing:-.015em;margin:0 0 10px}
.action-line p{font-size:12px;color:#7a897d;line-height:1.6;max-width:520px;margin:0}
.action-line-tail{display:flex;flex-direction:column;align-items:flex-end;gap:22px}
.action-line-tail>strong{font-size:17px;font-family:var(--serif);font-weight:400;color:#4b7e65;white-space:nowrap}
.review-btn{display:flex;align-items:center;gap:5px;min-height:34px;background:transparent;border:0;color:#3d7460;font-size:10px;font-weight:780}

.lab-method{background:#1e403d;color:#e6eae4;padding:30px;min-height:390px;display:flex;flex-direction:column}

.lab-method p{color:#adc3b3;font-size:12px;line-height:1.7}

.scout-toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:39px 0 35px}

.index-columns>span:last-child{text-align:right}

 'league':'<path d="M5 20V8h5v12M14 20V4h5v16M3 20h18"/>',
 'arrow':'<path d="M5 12h14m-6-6 6 6-6 6"/>',
 'chevron':'<path d="m8 10 4 4 4-4"/>',
 'close':'<path d="M5 5 19 19M19 5 5 19"/>',
 'check':'<path d="m4 12 5 5L20 6"/>',
 'bell':'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9M10 21h4"/>',
 'sliders':'<path d="M4 7h16M4 17h16M9 4v6M15 14v6"/>',
 'plus':'<path d="M12 4v16M4 12h16"/>',
 'back':'<path d="m15 18-6-6 6-6"/>',
 'more':'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
}[name]||'');
const svg=(name,sz=20)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon(name)}</svg>`;
const nav=[['briefing','Briefing','01'],['lab','Decision Lab','02'],['scout','Scout','03'],['league','League','04']];
function shell(page){
 return `<a class="skip-link" href="#content">Skip to content</a>
 <div class="workspace">
   <aside class="rail" aria-label="Primary navigation">
     <div class="mark"><div class="mark-symbol"><span>P</span><b>—</b><span>N</span></div><div class="mark-title">POWERS–NEWLON <small>THE FANTASY INTELLIGENCE SYSTEM</small></div></div>
     <div class="rail-label">THE WORKSPACE</div>
     <nav class="rail-nav">${nav.map(([k,t,n])=>`<button class="rail-link ${state.page===k?'active':''}" data-nav="${k}" ${state.page===k?'aria-current="page"':''}><span class="rail-number">${n}</span><span>${t}</span><span class="rail-arrow">↗</span></button>`).join('')}</nav>
     <div class="rail-note"><div class="rail-note-line"><span class="signal-dot"></span>MODEL STUDY <span class="rail-stamp">CONCEPT DATA</span></div><p>Independent projections.<br>Clearer decisions.</p><span class="rail-note-bottom">2026 SEASON · WEEK ${state.week.toString().padStart(2,'0')}</span></div>
   </aside>
   <div class="main-column">
     <header class="topline"><div class="mobile-mark">P<span>—</span>N</div><div class="topline-left"><span class="topline-overline">POWERS–NEWLON</span><span class="topline-div"></span><span>${h(DEMO.league)}</span></div><div class="topline-right"><span class="demo-pill"><span></span> DESIGN PROTOTYPE</span><button class="icon-button" data-action="notification" aria-label="Design information">${svg('more',19)}</button></div></header>
     <main id="content" class="view-wrap" tabindex="-1"><div class="page-enter">${page}</div></main>
   </div>
 </div>
 <nav class="mobile-dock" aria-label="Primary navigation">${nav.map(([k,t,n])=>`<button data-nav="${k}" class="dock-item ${state.page===k?'active':''}" ${state.page===k?'aria-current="page"':''}>${svg(k,21)}<span>${k==='lab'?'Decisions':t}</span></button>`).join('')}</nav>
 <div id="inspector-root"></div>
 <div id="notice-root" aria-live="polite"></div>`;
}
function barChart(values,{height=52,color='currentColor'}={}){
 const min=Math.min(...values)-2,max=Math.max(...values)+2,step=100/(values.length-1||1);
 const pts=values.map((v,i)=>`${i*step},${90-(v-min)/(max-min||1)*70}`).join(' ');
 return `<svg class="spark" style="height:${height}px" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Historical weekly trend"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function eyebrow(text){return `<span class="eyebrow">${text}</span>`;}
function sectionTitle(index,title,aside=''){return `<div class="section-hdr"><div><span class="section-number">${index}</span><h2>${title}</h2></div>${aside?`<span class="section-aside">${aside}</span>`:''}</div>`;}
function actionRow(item,index){return `<div class="action-line ${state.reviewed.has(item.id)?'reviewed':''}">
  <span class="action-line-index">0${index+1}</span><div class="action-line-main"><div class="action-overline">${h(item.kind)} <span class="bullet">·</span> ${h(item.priority)}</div><h3>${h(item.title)}</h3><p>${h(item.detail)}</p></div>
  <div class="action-line-tail"><strong>${h(item.impact)}</strong><button data-review="${item.id}" class="review-btn ${state.reviewed.has(item.id)?'done':''}" aria-label="${state.reviewed.has(item.id)?'Mark not reviewed':'Mark reviewed'}: ${h(item.title)}">${state.reviewed.has(item.id)?svg('check',18):svg('arrow',18)}<span>${state.reviewed.has(item.id)?'Reviewed':'Review'}</span></button></div></div>`;}
function briefing(){const margin=DEMO.you-DEMO.them;
 return `<div class="briefing">
   <div class="intro-grid"><div>${eyebrow('YOUR WEEKLY BRIEFING')}<h1 class="display-title">A clearer<br><em>way to win.</em></h1><p class="intro-description">Everything that matters this week—without the noise.</p></div><div class="intro-meta"><div class="meta-top">WEEK <strong>${String(state.week).padStart(2,'0')}</strong></div><div class="meta-rule"></div><div class="meta-bottom"><span>REGULAR SEASON</span><b>2026</b></div><div class="meta-foot">YOUR RECORD <strong>${DEMO.record}</strong></div></div></div>
   <section class="briefing-hero" aria-label="Your weekly matchup"><div class="hero-head"><span>01 / YOUR MATCHUP</span><span class="hero-status"><i></i> PREGAME OUTLOOK</span></div>
   <div class="match-layout"><div class="score-team"><span>YOUR TEAM</span><h2>${h(DEMO.team)}</h2><strong>${num(DEMO.you)}</strong><small>PROJECTED PPR</small></div>
   <div class="match-center"><div class="match-vs">VS</div><div class="match-centermark"></div></div>
   <div class="score-team right"><span>THE OPPOSITION</span><h2>${h(DEMO.opponent)}</h2><strong>${num(DEMO.them)}</strong><small>PROJECTED PPR</small></div></div>
   <div class="hero-foot"><div class="hero-metric"><span>THE DIFFERENCE</span><strong>${margin>0?'+':''}${num(margin)} <small>PTS</small></strong></div><div class="hero-foot-text">The model currently favors your opponent. <span>Your next move matters.</span></div><button data-nav="lab" class="hero-link">Explore the edge ${svg('arrow',19)}</button></div>
   </section>
   <div class="briefing-grid"><section class="briefing-priority">${sectionTitle('02','The call','HIGHEST-LEVERAGE IDEA')}<div class="priority-block"><span class="priority-rule"></span><div class="priority-body"><span class="priority-tag">MODEL RECOMMENDATION</span><h3>Find the points<br><em>you’re leaving out.</em></h3><p>Jakobi Meyers projects more favorably than DeVonta Smith this week. The opportunity is worth investigating before kickoff.</p><div class="priority-footer"><span>EST. MODEL EDGE <b>+4.1 PPR</b></span><button data-nav="lab">Open Decision Lab ${svg('arrow',17)}</button></div></div></div></section>
   <section class="briefing-quick">${sectionTitle('03','On the radar','THREE ITEMS')}<div class="radar-list">${DEMO.opportunities.map((o,i)=>`<button class="radar-row" data-nav="lab"><span>0${i+1}</span><strong>${h(o.title)}</strong><i>${h(o.impact)}</i>${svg('arrow',15)}</button>`).join('')}</div><div class="model-source"><span class="signal-dot"></span> ANALYSIS FROM POWERS–NEWLON MODEL <span class="source-v">V 3.0 / CONCEPT</span></div></section></div>
   <section class="bottom-teaser">${sectionTitle('04','Your exposure','STARTING GROUP')}<div class="exposure-grid">${DEMO.players.slice(0,4).map((p,i)=>`<button class="exposure-item" data-player="${p.id}"><span class="exposure-top"><i>${p.pos}</i><span>0${i+1}</span></span><strong>${h(p.name)}</strong><div class="exposure-bar"><span style="width:${Math.round(p.projection/25*100)}%"></span></div><div class="exposure-foot"><small>${p.team} · ${p.opp}</small><b>${num(p.projection)}</b></div></button>`).join('')}</div></section>
 </div>`;
}
function decisionLab(){const pA=playersById[state.compareA],pB=playersById[state.compareB],gap=pB.projection-pA.projection;
 return `<div class="lab-page">${eyebrow('DECISION LAB / MODEL THINKING')}<div class="page-header"><h1 class="display-title">Make the<br><em>right call.</em></h1><p>Reason through every lineup decision with numbers, context, and alternatives—not just rankings.</p></div>
   <div class="lab-workbench"><div class="lab-workbench-header"><span>01 / PLAYER COMPARISON</span><span>MODEL SCENARIO · NOT A ROSTER CHANGE</span></div>
   <div class="compare-grid"><div class="compare-person"><label for="compare-a">OPTION A</label><select id="compare-a">${DEMO.players.map(p=>`<option value="${p.id}" ${p.id===pA.id?'selected':''}>${h(p.name)}</option>`).join('')}</select><div class="compare-stat"><strong>${num(pA.projection)}</strong><small>PROJECTED PPR</small></div>${barChart(pA.trend,{height:67,color:'#D56B4A'})}<div class="compare-foot">${pA.pos} · ${pA.team} <b>${pA.confidence}</b></div></div>
   <div class="compare-divider"><span>AGAINST</span></div>
   <div class="compare-person"><label for="compare-b">OPTION B</label><select id="compare-b">${DEMO.players.map(p=>`<option value="${p.id}" ${p.id===pB.id?'selected':''}>${h(p.name)}</option>`).join('')}</select><div class="compare-stat"><strong>${num(pB.projection)}</strong><small>PROJECTED PPR</small></div>${barChart(pB.trend,{height:67,color:'#32776B'})}<div class="compare-foot">${pB.pos} · ${pB.team} <b>${pB.confidence}</b></div></div></div>
   <div class="decision-result"><div><span>THE MODEL’S CURRENT LEAN</span><h2>${h(gap>=0?pB.name:pA.name)}</h2><p>${gap>=0?'Option B':'Option A'} projects higher by ${num(Math.abs(gap))} PPR. This is a forecast difference, not certainty.</p></div><div class="result-delta"><small>EXPECTED EDGE</small><strong>${gap>0?'+':''}${num(gap)}</strong><span>B − A · PPR</span></div></div>
   </div>
   <div class="lab-bottom"><section>${sectionTitle('02','Opportunity ledger','REVIEW & DISMISS')}<div class="action-list">${DEMO.opportunities.map(actionRow).join('')}</div></section><aside class="lab-method"><span class="method-index">NOTE / 01</span><h3>The number<br><em>isn’t the decision.</em></h3><p>Matchups, opportunity, availability, and uncertainty shape the forecast. You choose the move that fits your league and roster.</p><div class="method-rule"></div><span>NO AUTOMATIC SLEEPER TRANSACTIONS</span></aside></div>
 </div>`;
}
function scout(){const q=state.query.toLowerCase();const ps=DEMO.players.filter(p=>(state.position==='ALL'||p.pos===state.position)&&(`${p.name} ${p.pos} ${p.team}`.toLowerCase().includes(q))).sort((a,b)=>b.projection-a.projection);
 return `<div class="scout-page">${eyebrow('SCOUT / PLAYER INTELLIGENCE')}<div class="page-header"><h1 class="display-title">Know more.<br><em>Guess less.</em></h1><p>An index of model projections built to be searched, scanned, and examined.</p></div>
   <div class="scout-toolbar"><div class="search-field">${svg('scout',21)}<input id="scout-query" type="search" value="${h(state.query)}" placeholder="Search players, positions or teams" autocomplete="off" aria-label="Search players"></div><div class="filter-set" aria-label="Filter by position">${['ALL','QB','RB','WR','TE'].map(x=>`<button data-filter="${x}" class="${x===state.position?'active':''}" aria-pressed="${x===state.position}">${x==='ALL'?'All':x}</button>`).join('')}</div></div>
   <div class="index-heading"><span>THE PLAYER INDEX <i>/</i> <b>${ps.length} RESULTS</b></span><span>WEEK ${String(state.week).padStart(2,'0')} · PPR</span></div>
   <div class="index-list"><div class="index-columns"><span>PLAYER</span><span>MODEL RANGE</span><span>PROJECTION</span></div>${ps.map((p,i)=>`<button class="player-index-row" data-player="${p.id}"><span class="index-number">${String(i+1).padStart(2,'0')}</span><span class="index-ident"><b>${h(p.name)}</b><small>${p.pos} / ${p.team} · ${p.opp}</small></span><span class="index-range"><span class="range-track"><i style="left:${p.floor/30*100}%;width:${(p.ceiling-p.floor)/30*100}%"></i><b style="left:${p.projection/30*100}%"></b></span><small>${num(p.floor)} – ${num(p.ceiling)}</small></span><span class="index-projection">${num(p.projection)}</span><span class="index-arrow">${svg('arrow',20)}</span></button>`).join('')}</div>
   ${ps.length?'':'<p class="empty-message">No players match your search.</p>'}
   <p class="index-footnote">Example values for UI evaluation only. Live player data is not connected in this prototype.</p></div>`;
}
function league(){let standings=[...DEMO.standings].sort(state.standings==='record'?(a,b)=>b.wins-a.wins||(b.points-a.points):(a,b)=>b.points-a.points);
 return `<div class="league-page">${eyebrow('LEAGUE / THE BIGGER PICTURE')}<div class="page-header"><h1 class="display-title">Read the<br><em>whole field.</em></h1><p>Standings, competitive context, and where your team can realistically improve.</p></div>
   <div class="league-head"><div><span>THE LEAGUE TABLE</span><h2>${h(DEMO.league)}</h2><p>${DEMO.standings.length} teams shown · 2026 regular season</p></div><div class="league-sort" role="group" aria-label="Rank standings by"><button class="${state.standings==='record'?'active':''}" data-standings="record">Record</button><button class="${state.standings==='points'?'active':''}" data-standings="points">Points</button></div></div>
   <div class="standings-table"><div class="standings-columns"><span>TEAM</span><span>RECORD</span><span>POINTS FOR</span></div>${standings.map((r,i)=>`<div class="standing-line ${r.tag==='You'?'you':''}"><span class="standing-rank">${String(i+1).padStart(2,'0')}</span><div class="standing-title"><strong>${h(r.name)}</strong><small>${r.tag==='You'?'YOUR TEAM':r.tag.toUpperCase()}</small></div><span class="standing-record">${r.wins} – ${r.losses}</span><span class="standing-points">${num(r.points)}</span></div>`).join('')}</div>
   <div class="league-notes"><div class="league-note"><span>01 / THE MOMENT</span><h3>One decision can change the week.</h3><p>Your projected deficit is ${num(DEMO.them-DEMO.you)} points. Review your highest-impact adjustments in the Decision Lab.</p><button data-nav="lab">Work the matchup ${svg('arrow',17)}</button></div><div class="league-note inverse"><span>02 / THE LONG VIEW</span><h3>Dynasty is a different horizon.</h3><p>Separate short-term lineup optimization from asset value. The model is designed to support both without treating them as the same number.</p></div></div>
 </div>`;
}
function playerInspector(p){return `<div class="scrim" data-close-inspector></div><aside class="inspector" role="dialog" aria-modal="true" aria-labelledby="inspector-title"><div class="inspector-top"><span>PLAYER DOSSIER / ${p.pos}</span><button data-close-inspector class="inspector-close" aria-label="Close player dossier">${svg('close',20)}</button></div>
  <div class="inspector-intro">${eyebrow('THE POWERS–NEWLON MODEL')}<h2 id="inspector-title">${h(p.name)}</h2><p>${p.pos} / ${p.team} · ${p.opp}</p></div><div class="inspector-number"><strong>${num(p.projection)}</strong><div><span>WEEK ${state.week}</span><b>PROJECTED PPR</b></div></div>
  <div class="inspector-trend"><div><span>HISTORICAL SHAPE</span><small>ILLUSTRATIVE TREND</small></div>${barChart(p.trend,{height:110,color:'#DA7955'})}</div>
  <div class="inspector-metrics"><div><span>LOW RANGE</span><strong>${num(p.floor)}</strong></div><div><span>HIGH RANGE</span><strong>${num(p.ceiling)}</strong></div><div><span>SEASON PPG</span><strong>${num(p.avg)}</strong></div><div><span>CONFIDENCE</span><strong class="word">${h(p.confidence)}</strong></div></div>
  <div class="inspector-analysis"><span>MODEL NOTE / 01</span><p>${h(p.summary)}</p></div><button class="inspector-compare" data-compare-player="${p.id}">${svg('plus',18)} Add to Decision Lab</button><p class="inspector-foot">Demonstration data only. No roster changes are made from this screen.</p></aside>`;}
function notice(){return `<div class="notice"><button class="notice-close" data-action="notice-close" aria-label="Close">${svg('close',16)}</button><strong>Design study, not live data.</strong><p>This prototype demonstrates the proposed visual and interaction system. Player projections, league scores, and recommendations are illustrative and do not reflect a connected league.</p></div>`;}
function render({preserveScroll=false}={}){const scroll=window.scrollY;const page=state.page==='briefing'?briefing():state.page==='lab'?decisionLab():state.page==='scout'?scout():league();$('#app').innerHTML=shell(page);if(state.inspector)openInspector(state.inspector,false);if(state.notifications)$('#notice-root').innerHTML=notice();bind();if(state.notifications)bindNotice();if(preserveScroll)window.scrollTo(0,scroll)}
function navigate(page){if(!nav.some(x=>x[0]===page))return;state.page=page;state.inspector=null;render();window.scrollTo({top:0,behavior:'instant'});const view=$('.page-enter');if(view&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){view.animate([{opacity:.5,transform:'translate3d(0,9px,0)'},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:260,easing:'cubic-bezier(.22,1,.36,1)'})}}
let originalFocus=null;
function openInspector(id,setFocus=true){const p=playersById[id];if(!p)return;state.inspector=id;if(setFocus)originalFocus=document.activeElement;$('#inspector-root').innerHTML=playerInspector(p);document.body.classList.add('has-inspector');if(setFocus)setTimeout(()=>$('.inspector-close')?.focus({preventScroll:true}),10)}
function closeInspector(){state.inspector=null;$('#inspector-root').innerHTML='';document.body.classList.remove('has-inspector');if(originalFocus?.isConnected)originalFocus.focus({preventScroll:true});originalFocus=null}
function bind(){
  $$('[data-nav]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.nav)));
  $$('[data-player]').forEach(el=>el.addEventListener('click',()=>openInspector(el.dataset.player)));
  $$('[data-review]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.review;state.reviewed.has(id)?state.reviewed.delete(id):state.reviewed.add(id);render({preserveScroll:true})}));
  $('#compare-a')?.addEventListener('change',e=>{state.compareA=e.target.value;render({preserveScroll:true})});
  $('#compare-b')?.addEventListener('change',e=>{state.compareB=e.target.value;render({preserveScroll:true})});
  $('#scout-query')?.addEventListener('input',e=>{const position=e.target.selectionStart;state.query=e.target.value;render({preserveScroll:true});const inp=$('#scout-query');inp?.focus({preventScroll:true});if(inp&&position!==null)inp.setSelectionRange(position,position)});
  $$('[data-filter]').forEach(el=>el.addEventListener('click',()=>{state.position=el.dataset.filter;render({preserveScroll:true})}));
  $$('[data-standings]').forEach(el=>el.addEventListener('click',()=>{state.standings=el.dataset.standings;render({preserveScroll:true})}));
  $('[data-action="notification"]')?.addEventListener('click',()=>{state.notifications=!state.notifications;$('#notice-root').innerHTML=state.notifications?notice():'';bindNotice()});
}
function bindNotice(){$('[data-action="notice-close"]')?.addEventListener('click',()=>{state.notifications=false;$('#notice-root').innerHTML=''})}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close-inspector]'))closeInspector();
  const action=e.target.closest('[data-compare-player]');if(action){state.compareA=action.dataset.comparePlayer;closeInspector();navigate('lab')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.inspector){e.preventDefault();closeInspector();return}
  if(e.key==='Tab'&&state.inspector){const root=$('.inspector'),focusable=$$('button:not([disabled]),a[href],input,select',root).filter(x=>x.getClientRects().length);if(focusable.length){if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable.at(-1).focus()}if(!e.shiftKey&&document.activeElement===focusable.at(-1)){e.preventDefault();focusable[0].focus()}}}
});
render();

  </script>
</body>
</html>
